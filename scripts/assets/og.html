<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #111318; color: #fff; font-family: Inter, sans-serif; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 4px; font-family: 'Space Grotesk'; font-weight: 600; font-size: 44px; letter-spacing: -0.03em; }
  .logo svg { width: 76px; height: 76px; }
  h1 { font-family: 'Space Grotesk'; font-weight: 700; font-size: 66px; line-height: 1.04; letter-spacing: -0.03em; max-width: 960px; }
  p { font-size: 28px; color: #C9CCD2; max-width: 900px; line-height: 1.35; }
  .mark { position: absolute; right: -120px; bottom: -160px; width: 620px; height: 620px; opacity: .08; }
</style>
</head>
<body>
<!-- Geometria da logo: public/logo.svg -->
<svg class="mark" viewBox="0 0 120 120"><rect width="120" height="120" fill="#111318"/><line x1="90" y1="26" x2="30" y2="94" stroke="#1F5BFF" stroke-width="13" stroke-linecap="round"/><line x1="30" y1="26" x2="90" y2="94" stroke="#111318" stroke-width="27"/><polyline points="30,94 30,26 90,94 90,26" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="logo"><svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#111318"/><line x1="90" y1="26" x2="30" y2="94" stroke="#1F5BFF" stroke-width="13" stroke-linecap="round"/><line x1="30" y1="26" x2="90" y2="94" stroke="#111318" stroke-width="27"/><polyline points="30,94 30,26 90,94 90,26" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>novix</div>
<div>
  <h1>Do físico ao <span style="color:#4D7DFF">digital.</span></h1>
  <p style="margin-top:24px">Soluções digitais para empresas: sites, sistemas e tecnologia NFC em Boqueirão, Campina Grande e região.</p>
</div>
</body>
</html>
